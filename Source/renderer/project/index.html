<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Document Analysis</title>
    <link rel="stylesheet" href="../global.css" />
  </head>
  <body class="page-project">
    <div class="layout">
      <header class="topbar">
        <div class="topbar-brand">
          <button id="back-btn" class="btn-back" title="Back to projects">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="8" fill="#1a56db" />
            <path d="M10 12h20M10 18h14M10 24h20M10 30h10" stroke="white" stroke-width="2.5" stroke-linecap="round" />
          </svg>
          <span class="brand-name" id="project-name">Project</span>
        </div>
        <div class="topbar-user">
          <span id="user-email" class="user-email"></span>
          <button id="logout-btn" class="btn-logout">Sign Out</button>
        </div>
      </header>

      <main class="project-content">
        <div class="project-panels">

          <section class="project-panel" id="documents-panel">
            <div class="panel-header">
              <div class="panel-title-group">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="2" y="1" width="11" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M5 5h5M5 8h4M5 11h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <h2>Documents</h2>
              </div>
              <button class="btn-primary btn-sm" disabled>+ Add Document</button>
            </div>
            <div class="panel-placeholder">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="4" width="22" height="28" rx="3" stroke="#d1d5db" stroke-width="2"/>
                <path d="M11 13h12M11 18h8M11 23h12" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
                <circle cx="30" cy="30" r="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
                <path d="M27 30h6M30 27v6" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <p class="placeholder-title">Document management coming soon</p>
              <p class="placeholder-sub">Upload, organise, and analyse documents in this project.</p>
            </div>
          </section>

          <section class="project-panel" id="graph-panel">
            <div class="panel-header">
              <div class="panel-title-group">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="3" cy="3" r="1.5" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="15" cy="3" r="1.5" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="3" cy="15" r="1.5" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="15" cy="15" r="1.5" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M4.5 4.5L6.5 6.5M11.5 6.5L13.5 4.5M4.5 13.5L6.5 11.5M11.5 11.5L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <h2>Relationship Graph</h2>
              </div>
            </div>
            <div class="panel-placeholder">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="5" stroke="#d1d5db" stroke-width="2"/>
                <circle cx="6" cy="8" r="3" stroke="#d1d5db" stroke-width="1.5"/>
                <circle cx="34" cy="8" r="3" stroke="#d1d5db" stroke-width="1.5"/>
                <circle cx="6" cy="32" r="3" stroke="#d1d5db" stroke-width="1.5"/>
                <circle cx="34" cy="32" r="3" stroke="#d1d5db" stroke-width="1.5"/>
                <line x1="9" y1="10" x2="15.5" y2="15.5" stroke="#d1d5db" stroke-width="1.5"/>
                <line x1="31" y1="10" x2="24.5" y2="15.5" stroke="#d1d5db" stroke-width="1.5"/>
                <line x1="9" y1="30" x2="15.5" y2="24.5" stroke="#d1d5db" stroke-width="1.5"/>
                <line x1="31" y1="30" x2="24.5" y2="24.5" stroke="#d1d5db" stroke-width="1.5"/>
              </svg>
              <p class="placeholder-title">Graph visualisation coming soon</p>
              <p class="placeholder-sub">Entity and relationship graphs will appear here once documents are analysed.</p>
            </div>
          </section>

        </div>
      </main>
    </div>
    <script src="../../dist/renderer/project/index.js" defer></script>
  </body>
</html>
