<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Document Analysis</title>
    <link rel="stylesheet" href="../global.css" />
  </head>
  <body class="page-project">
    <div class="layout">
      <header class="topbar">
        <div class="topbar-brand">
          <button id="back-btn" class="btn-back" title="Back to projects">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="8" fill="#1a56db" />
            <path d="M10 12h20M10 18h14M10 24h20M10 30h10" stroke="white" stroke-width="2.5" stroke-linecap="round" />
          </svg>
          <span class="brand-name" id="project-name">Project</span>
        </div>
        <div class="topbar-user">
          <span id="user-email" class="user-email"></span>
          <button id="logout-btn" class="btn-logout">Sign Out</button>
        </div>
      </header>

      <main class="project-content">
        <div class="project-panels">

          <section class="project-panel" id="documents-panel">
            <div class="panel-header">
              <div class="panel-title-group">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="2" y="1" width="11" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M5 5h5M5 8h4M5 11h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <h2>Documents</h2>
              </div>
              <div class="doc-header-actions hidden" id="doc-header-actions">
                <div class="dropdown-container">
                  <button class="btn-sm btn-primary" id="add-docs-btn">+ Add Documents</button>
                  <div class="dropdown-menu hidden" id="add-docs-menu">
                    <button class="dropdown-item" id="add-files-option">
                      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="1" width="8" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                        <path d="M3.5 4h3M3.5 6.5h2M3.5 9h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                      </svg>
                      Files
                    </button>
                    <button class="dropdown-item" id="add-folder-option">
                      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 3.5A1.5 1.5 0 012.5 2h2.586a1 1 0 01.707.293L6.5 3H11.5A1.5 1.5 0 0113 4.5v6A1.5 1.5 0 0111.5 12h-9A1.5 1.5 0 011 10.5v-7z" stroke="currentColor" stroke-width="1.3"/>
                      </svg>
                      Folder
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div id="docs-loading" class="panel-loading">
              <div class="spinner"></div>
              <span>Loading documents…</span>
            </div>

            <div id="docs-upload-zone" class="upload-zone hidden" role="button" tabindex="0"
                 aria-label="Drop files here or click to browse">
              <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="6" width="20" height="24" rx="3" stroke="#d1d5db" stroke-width="1.8"/>
                <path d="M8 13h12M8 18h8M8 23h12" stroke="#d1d5db" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="28" cy="28" r="7" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
                <path d="M25.5 28h5M28 25.5v5" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <p class="upload-zone-title">Drop files or folders here</p>
              <p class="upload-zone-sub">or click to browse files</p>
            </div>

            <div id="docs-list-container" class="doc-list-container hidden">
              <div id="docs-list" class="doc-list"></div>
            </div>

            <div id="docs-upload-status" class="upload-status hidden">
              <div class="spinner" style="width:16px;height:16px;border-width:2px"></div>
              <span id="docs-upload-status-text"></span>
            </div>

            <div id="docs-upload-error" class="upload-error hidden"></div>
          </section>

          <section class="project-panel" id="graph-panel">
            <div class="panel-header">
              <div class="panel-title-group">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="3" cy="3" r="1.5" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="15" cy="3" r="1.5" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="3" cy="15" r="1.5" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="15" cy="15" r="1.5" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M4.5 4.5L6.5 6.5M11.5 6.5L13.5 4.5M4.5 13.5L6.5 11.5M11.5 11.5L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <h2>Relationship Graph</h2>
              </div>
            </div>

            <div id="graph-loading" class="panel-loading hidden">
              <div class="spinner"></div>
              <span>Loading graph…</span>
            </div>

            <div id="graph-empty" class="panel-placeholder">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="5" stroke="#d1d5db" stroke-width="2"/>
                <circle cx="6" cy="8" r="3" stroke="#d1d5db" stroke-width="1.5"/>
                <circle cx="34" cy="8" r="3" stroke="#d1d5db" stroke-width="1.5"/>
                <circle cx="6" cy="32" r="3" stroke="#d1d5db" stroke-width="1.5"/>
                <circle cx="34" cy="32" r="3" stroke="#d1d5db" stroke-width="1.5"/>
                <line x1="9" y1="10" x2="15.5" y2="15.5" stroke="#d1d5db" stroke-width="1.5"/>
                <line x1="31" y1="10" x2="24.5" y2="15.5" stroke="#d1d5db" stroke-width="1.5"/>
                <line x1="9" y1="30" x2="15.5" y2="24.5" stroke="#d1d5db" stroke-width="1.5"/>
                <line x1="31" y1="30" x2="24.5" y2="24.5" stroke="#d1d5db" stroke-width="1.5"/>
              </svg>
              <p class="placeholder-title">No analysed documents yet</p>
              <p class="placeholder-sub">Entity and relationship graphs will appear here once documents are analysed.</p>
            </div>

            <div id="graph-canvas" class="hidden"></div>
          </section>

        </div>
      </main>
    </div>
    <script src="../../node_modules/cytoscape/dist/cytoscape.min.js"></script>
    <script src="../../dist/renderer/project/index.js" defer></script>
  </body>
</html>
