<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Document Analysis — Sign In</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="logo">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="8" fill="#1a56db" />
            <path d="M10 12h20M10 18h14M10 24h20M10 30h10" stroke="white" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </div>
        <h1>Document Analysis</h1>
        <p class="subtitle">Extract entity relationships from your documents using AI</p>

        <div class="tab-bar">
          <button class="tab-btn active" data-panel="signin">Sign In</button>
          <button class="tab-btn" data-panel="signup">Create Account</button>
        </div>

        <div id="signin-panel">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="username" autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <button id="sign-in-btn" class="btn-primary">Sign In</button>
        </div>

        <div id="signup-panel" class="hidden">
          <div class="form-group">
            <label for="new-username">Username</label>
            <input type="text" id="new-username" placeholder="username" autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="new-password">Password</label>
            <input type="password" id="new-password" placeholder="••••••••" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password" />
          </div>
          <button id="create-btn" class="btn-primary">Create Account</button>
        </div>

        <p id="error-msg" class="error-msg hidden"></p>
      </div>
    </div>
    <script src="../dist/renderer/login.js" defer></script>
  </body>
</html>
