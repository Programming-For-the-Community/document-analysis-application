<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Document Analysis</title>
    <link rel="stylesheet" href="../global.css" />
  </head>
  <body class="page-home">
    <div class="layout">
      <header class="topbar">
        <div class="topbar-brand">
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="8" fill="var(--primary)" />
            <path d="M10 12h20M10 18h14M10 24h20M10 30h10" stroke="white" stroke-width="2.5" stroke-linecap="round" />
          </svg>
          <span class="brand-name">Document Analysis</span>
        </div>
        <div class="topbar-user">
          <span id="user-email" class="user-email"></span>
          <button id="theme-toggle-btn" class="btn-theme-toggle" title="Switch theme" aria-label="Switch theme"></button>
          <button id="logout-btn" class="btn-logout">Sign Out</button>
        </div>
      </header>

      <main class="main-content">
        <div class="page-header">
          <h1>Your Projects</h1>
          <button class="btn-primary" id="new-project-btn">+ New Project</button>
        </div>

        <div id="projects-loading" class="loading-state">
          <div class="spinner"></div>
          <p>Loading projects…</p>
        </div>

        <div id="projects-error" class="empty-state hidden">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="20" stroke="#9ca3af" stroke-width="2"/>
            <path d="M24 14v12M24 32v2" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <p id="projects-error-msg">Failed to load projects.</p>
          <button class="btn-primary" id="projects-retry-btn">Retry</button>
        </div>

        <div id="projects-empty" class="empty-state hidden">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="6" width="26" height="34" rx="3" stroke="#9ca3af" stroke-width="2" />
            <path d="M14 16h14M14 22h10M14 28h14" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" />
            <circle cx="36" cy="36" r="8" fill="var(--primary)" />
            <path d="M33 36h6M36 33v6" stroke="white" stroke-width="2" stroke-linecap="round" />
          </svg>
          <p>No projects yet.</p>
          <p class="empty-sub">Create a project to start uploading and analysing documents.</p>
        </div>

        <div id="projects-list" class="projects-grid hidden"></div>
      </main>
    </div>
    <div id="rename-project-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <h2 class="modal-title">Rename Project</h2>
        <div class="form-group">
          <label for="rename-project-name">New name</label>
          <input type="text" id="rename-project-name" maxlength="100" />
        </div>
        <p id="rename-project-error" class="error-msg hidden"></p>
        <div class="modal-actions">
          <button id="rename-project-cancel" class="btn-secondary">Cancel</button>
          <button id="rename-project-submit" class="btn-primary">Rename</button>
        </div>
      </div>
    </div>

    <div id="delete-project-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <h2 class="modal-title">Delete Project</h2>
        <p class="modal-body">Are you sure you want to delete <strong id="delete-project-name"></strong>? All documents and graph data will be permanently removed.</p>
        <div class="modal-actions">
          <button id="delete-project-cancel" class="btn-secondary">Cancel</button>
          <button id="delete-project-confirm" class="btn-danger">Delete</button>
        </div>
      </div>
    </div>

    <div id="new-project-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <h2 class="modal-title">New Project</h2>
        <div class="form-group">
          <label for="new-project-name">Project name</label>
          <input type="text" id="new-project-name" placeholder="e.g. Legal Contracts Q1" maxlength="100" />
        </div>
        <p id="new-project-error" class="error-msg hidden"></p>
        <div class="modal-actions">
          <button id="new-project-cancel" class="btn-secondary">Cancel</button>
          <button id="new-project-submit" class="btn-primary">Create Project</button>
        </div>
      </div>
    </div>

    <script src="../../dist/renderer/home/index.js" defer></script>
  </body>
</html>
