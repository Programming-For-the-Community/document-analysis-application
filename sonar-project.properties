# Single repo-wide SonarQube Cloud project. sonar.organization/sonar.projectKey
# are passed in via -D args in .github/workflows/sonar_scan.yml (from
# vars.SONAR_ORGANIZATION/vars.SONAR_PROJECT_KEY) rather than hardcoded here.
#
# Locally, `npm run lint` (Source/eslint.config.js) runs the same JS/TS rules via
# eslint-plugin-sonarjs, so most issues can be fixed before they reach the scan.

# Terraform is analysed too (Sonar IaC rules) — the IAM policies, bucket policies
# and KMS key policy are where most of this app's security posture lives.
sonar.sources=Source,Terraform
sonar.tests=Source/tests
sonar.exclusions=**/node_modules/**,Source/dist/**,Source/dist-electron/**,Source/build/**,Source/coverage/**,Source/eval/**,Source/tests/**,Source/package-lock.json,Terraform/.terraform/**

# Analysed for issues but not expected to carry unit-test coverage: React view
# components (exercised through the hooks/handlers they call, which are covered),
# the preload bridge and Electron entry point (pure wiring that needs a real
# Electron runtime), and build/release CLI tooling and config. Keep in step with
# coverage.include/exclude in Source/vitest.config.mjs.
sonar.coverage.exclusions=Source/renderer/**/*.tsx,Source/preload/**,Source/main/index.ts,Source/scripts/build-icons.js,Source/scripts/build-renderer.js,Source/scripts/release.js,Source/scripts/eval-extraction.js,Source/eslint.config.js,Source/vitest.config.mjs

sonar.typescript.tsconfigPaths=Source/tsconfig.json,Source/renderer/tsconfig.json,Source/tests/tsconfig.json
sonar.terraform.provider.aws.version=5

# AWS_* is the project's naming convention for the static AWS service wrappers
# (mirrored in Source/eslint.config.js).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S101
sonar.issue.ignore.multicriteria.e1.resourceKey=Source/classes/aws/**
