# Reusable Terraform apply for the shared AWS infrastructure. Called once per
# run by app_deploy.yml (after its tests and SonarQube Cloud scan), and still
# runnable on its own via workflow_dispatch. Same shape as sports-predictor's
# tf_install.yml — it doesn't scan itself; the calling pipeline owns the scan.

name: AWS Setup

on:
  workflow_dispatch:
    inputs:
      manual_run:
        description: 'Manual Run'
        required: false
        default: true
        type: boolean
  workflow_call:

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_region: ${{ vars.AWS_RESOURCE_REGION }}
  TF_VAR_project: ${{ vars.PROJECT}}
  TF_VAR_owner: ${{ vars.OWNER}}
  TF_VAR_user_arn: ${{ secrets.AWS_USER_ARN }}
  TF_VAR_secrets_manager_path: ${{ vars.SECRETS_MANAGER_PATH }}
  TF_VAR_svc_acct_username: ${{ secrets.SVC_USER}}
  TF_VAR_svc_acct_password: ${{ secrets.SVC_PWD }}
  TF_VAR_qdrant_api_key: ${{ secrets.QDRANT_KEY }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: development

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure AWS Credentials (via OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_SVC_ACCT_ARN }}
        aws-region: ${{ vars.AWS_RESOURCE_REGION }}

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    # Note if Manual Run
    - name: Manual Run
      if: ${{ inputs.manual_run }}
      run: echo "Manual Run"

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform -chdir=Terraform init -reconfigure

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform -chdir=Terraform fmt -check

    # Validate Terraform
    - name: Terraform Validate
      run: terraform -chdir=Terraform validate

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform -chdir=Terraform plan

    # Build or change infrastructure according to Terraform configuration files
    - name: Terraform Apply
      run: terraform -chdir=Terraform apply -auto-approve