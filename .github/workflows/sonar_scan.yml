# Reusable workflow: runs a SonarQube Cloud analysis against the whole repo
# (single repo-wide project — see sonar-project.properties at the repo root).
# Same pattern as sports-predictor's sonar_scan.yml: called by each pipeline
# between its checks and its build/deploy jobs, always re-analysing the full repo.
#
# wait_for_quality_gate controls whether a failing quality gate fails THIS job
# (and, via the caller's `needs: scan`, everything downstream). Defaults to
# false — advisory only. app_deploy.yml passes true for pushes to main, making
# that the one place a failing quality gate actually blocks (the Terraform apply).
#
# Requires:
#   - secrets.SONAR_TOKEN, vars.SONAR_ORGANIZATION, vars.SONAR_PROJECT_KEY
#   - the SonarQube Cloud project's Analysis Method set to CI-based
#     (Administration > Analysis Method) — Automatic Analysis, the default for
#     new projects, rejects CI-submitted reports.
#
# Coverage: the calling pipeline's test job uploads Vitest's LCOV report as
# the `js-coverage` artifact. Artifacts are scoped to the whole workflow run,
# so it's downloadable here with no extra wiring; a standalone
# workflow_dispatch run of this file simply has none and scans without coverage.
#
# environment/parent_workflow are recorded on the analysis (sonar.buildString
# shows on the project's Activity page) so each run can be traced back to the
# pipeline that produced it. parent_workflow should be passed as
# `${{ github.workflow }}` from the CALLER's own job.

name: SonarQube Cloud Scan

on:
  workflow_dispatch:
    inputs: &inputs
      wait_for_quality_gate:
        description: 'Fail this job (and everything downstream) if the SonarQube Cloud quality gate fails'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Deployment environment this run belongs to (e.g. development, production) -- tagged on the analysis'
        required: false
        type: string
        default: 'development'
      parent_workflow:
        description: 'Name of the top-level pipeline calling this scan (pass the github.workflow context value from the caller''s own job) -- tagged on the analysis'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs: *inputs

permissions:
  contents: read
  actions: read

jobs:
  scan:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history — SonarQube's blame/new-code analysis needs it.
          fetch-depth: 0

      - name: Download coverage data
        # Tolerant of no artifact — standalone runs have no upstream test job
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-coverage
          path: js-coverage

      # Installed so the TypeScript analyser can resolve imported types (React,
      # Electron, AWS SDK) instead of reporting them as unresolved. Scripts are
      # skipped: nothing here needs the Electron binary or native rebuilds.
      - name: Install dependencies
        working-directory: Source
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve scanner args
        id: scanner_args
        run: |
          # Sanitised to one shell-safe token — the scan action passes this
          # string to sonar-scanner unquoted, so a raw space would word-split.
          PARENT_WORKFLOW="${{ inputs.parent_workflow }}"
          PARENT_WORKFLOW="${PARENT_WORKFLOW// /_}"
          ENVIRONMENT="${{ inputs.environment }}"
          ENVIRONMENT="${ENVIRONMENT// /_}"
          ARGS="-Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} -Dsonar.qualitygate.wait=${{ inputs.wait_for_quality_gate }} -Dsonar.buildString=${ENVIRONMENT}-${PARENT_WORKFLOW} -Dsonar.analysis.environment=$ENVIRONMENT -Dsonar.analysis.parentWorkflow=$PARENT_WORKFLOW"
          # Vitest records SF: paths relative to Source/ (where it runs); rewritten
          # to repo-root-relative so they match sonar.sources. A mismatch here
          # doesn't error — the dashboard just silently shows 0% coverage.
          if [ -f js-coverage/lcov.info ]; then
            sed -i 's#^SF:#SF:Source/#' js-coverage/lcov.info
            echo "::group::lcov.info -- sample of recorded source paths"
            grep '^SF:' js-coverage/lcov.info | head -5
            echo "::endgroup::"
            ARGS="$ARGS -Dsonar.javascript.lcov.reportPaths=js-coverage/lcov.info"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

          # No secrets in $ARGS (SONAR_TOKEN goes in the action's env) — safe to print.
          echo "::group::Resolved sonar-scanner arguments"
          echo "$ARGS"
          echo "::endgroup::"

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ steps.scanner_args.outputs.args }}
